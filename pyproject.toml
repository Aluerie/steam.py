[project]
name = "steamio"
version = "1.2.0"
description = "A Python wrapper for the Steam API"
authors = [{ name = "Gobot1234", email = "gobot1234yt@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["steam.py", "steam", "steamio", "steam-api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.8,<4",
    "beautifulsoup4>=4.10,<5",
    "cryptography>=41,<43",
    "betterproto==2.0.0b6",
    "typing-extensions>=4.10.0,<5",
    "vdf>=3.4,<4",
    "zstd>=1.5.7.2,<2; python_version < '3.14'",
]

[project.urls]
Documentation = "https://steam-py.github.io/docs/latest"
Code = "https://github.com/Gobot1234/steam.py"
"Bug Tracker" = "https://github.com/Gobot1234/steam.py/issues"

[dependency-groups]
speedups = [
    "aiohttp[speedups]>=3.8,<4",
    "lxml>=4.8,<7",
    "orjson>=3.6.8,<4",
]
docs = [
    "sphinx>=7,<8",
    "myst-parser>=2,<3",
    "sphinxcontrib-trio>=1.1.2,<2",
    "sphinx-copybutton>=0.5.0,<0.6",
    "sphinx-codeautolink>=0.15,<0.16",
    "csscompressor>=0.9.5,<0.10",
    "htmlmin>=0.1.12,<0.2",
    "rjsmin>=1.2.0,<2",
    "click>=8.1.6,<9",
]
examples = [
    "discord.py>=2,<3",
    "babel>=2,<3",
]
dev = [
    "pytest>=7.1,<9",
    "pytest-asyncio>=0.21,<0.24",
    "pre-commit>=3.1,<4",
    "ruff==0.17.6",
    "hypothesis>=6.82.0,<7",
    "types-docutils>=0.20.0.1,<0.21",
    "hatchling>=1.27",  # for type checking hatch_build.py
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
# generated by hatch_build.py and gitignored
artifacts = ["steam/__metadata__.py"]

[tool.hatch.build.targets.wheel]
packages = ["steam"]

[tool.hatch.build.targets.sdist]
include = ["steam", "hatch_build.py"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# htmlmin is sdist-only and its build imports cgi (removed in 3.13), so tell uv its metadata instead of building it
dependency-metadata = [{ name = "htmlmin", version = "0.1.12", requires-dist = [] }]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["C4", "F", "G", "I", "PTH", "RUF", "SIM", "TC", "UP", "W", "PERF"]
ignore = ["F401", "F402", "F403", "F405", "PERF203", "RUF001", "RUF009", "RUF022", "RUF023", "SIM105", "TC006", "UP034"]
[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
allow_redefinition = true
show_error_codes = true
warn_no_return = false
pretty = true

[tool.pyright]
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportSelfClsParameterName = "none"
reportUntypedFunctionDecorator = "error"
reportUntypedClassDecorator = "error"
reportUntypedNamedTuple = "error"
reportImplicitStringConcatenation = "error"
reportOverlappingOverload = "error"
reportMissingTypeArgument = "error"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
strictParameterNoneValue = true
reportMissingImports = "error"
reportUnusedImport = "error"
reportFunctionMemberAccess = "warning"
reportDuplicateImport = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnknownParameterType = "error"
reportUnknownReturnType = "error"
# reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportShadowedImports = "none"
reportPrivateImportUsage = false
deprecateTypingAliases = true
enableExperimentalFeatures = true
ignore = ["docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
