name: Deploy

on:
  push:
  release:
    types: [created]

jobs:
  job:
    name: Build docs
    if: github.repository == 'Gobot1234/steam.py'
    runs-on: ubuntu-latest
    env:
      TARGET: steam-py/steam-py.github.io

    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET }}
          path: steam-py.github.io

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"  # htmlmin imports cgi, removed in 3.13
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --locked --group docs

      - name: Build
        if: ${{ github.event_name == 'push' }}
        run: |
          uv run --no-sync python scripts/build_docs_for_pages.py
      - name: Build
        if: ${{ github.event_name == 'release' }}
        run: |
          uv run --no-sync python scripts/build_docs_for_pages.py --tag=${{ github.event.release.tag_name }}

      - name: Push
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: ${{ env.TARGET }}
          publish_branch: main
          publish_dir: steam-py.github.io
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
