name: Lint.

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Check formatting
        run: uvx ruff@0.17.6 format --check

      - name: Lint
        run: uvx ruff@0.17.6 check --output-format github
